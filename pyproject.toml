[project]
name = "practice-theory-implementation"
version = "0.1.0"
description = "Step-by-step implementation accompanying AI Trust: Practice Theory — The Implementation."
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.43.0",
    "google-auth-oauthlib>=1.2.3",
    "httpx>=0.28.1",
    "mcp>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
practice-gmail-auth = "practice_theory_implementation.materials.google_mail:main"

[project.optional-dependencies]
anthropic = ["claude-agent-sdk>=0.1.0"]
# Codex needs no Python dep — uses the `codex` CLI on PATH (or PRACTICE_CODEX_BIN)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice_theory_implementation"]

[tool.basedpyright]
# Run in standard mode — equivalent to stock pyright (0 errors today). BasedPyright
# defaults to a stricter "recommended" mode whose "based" rules (reportAny, etc.)
# would flag the intentional Any/object at the JSON/MCP boundaries; adopt those
# incrementally via a baseline rather than all at once.
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pytest>=9.0.1",
    "ruff>=0.15.15",
]
