[project]
name = "practice-theory-implementation"
version = "0.1.0"
description = "Step-by-step implementation accompanying AI Trust: Practice Theory — The Implementation."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
anthropic = ["claude-agent-sdk>=0.1.0"]
# Codex needs no Python dep — uses the `codex` CLI on PATH (or PRACTICE_CODEX_BIN)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice_theory_implementation"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
